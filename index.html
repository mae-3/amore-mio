  function bytes(s){var r=atob(s),a=new Uint8Array(r.length);for(var i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
  /* Gross- und Kleinschreibung spielt keine Rolle: Der Code wird vor der
     Schluesselableitung immer auf Kleinbuchstaben gebracht. "Lovebirds",
     "lovebirds" und "LOVEBIRDS" fuehren damit zum selben Schluessel. */
  async function oeffnen(roh){
    var pw=String(roh).trim().toLowerCase();
    var b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    var k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:bytes(SALT),iterations:60000,hash:'SHA-256'},
          b,{name:'AES-GCM',length:256},false,['decrypt']);
    var klar=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,bytes(DATA));
    try{sessionStorage.setItem('hz-code',pw);}catch(x){}
    var html=new TextDecoder().decode(klar);
    await warten();
    document.open();document.write(html);document.close();
  }
  /* Wartet, bis Stylesheet und Schriften im Zwischenspeicher liegen.
     Verhindert den kurzen unformatierten Moment beim Umschalten.
     Nach spaetestens 2,5 Sekunden geht es in jedem Fall weiter. */
  function warten(){
    var dateien=['style.css','fonts/playfair-400.woff2','fonts/playfair-500.woff2',
                 'fonts/montserrat-300.woff2','fonts/montserrat-400.woff2','fonts/montserrat-500.woff2',
                 'umschlag-animation.mp4'];
    var laden=Promise.all(dateien.map(function(u){
      return fetch(u,{cache:'force-cache'}).catch(function(){});
    }));
    var notaus=new Promise(function(r){setTimeout(r,1200);});
    return Promise.race([laden,notaus]);
  }
  var f=document.getElementById('f'),e=document.getElementById('e'),b=document.getElementById('b');
  f.addEventListener('submit',async function(ev){
    ev.preventDefault();e.textContent='';b.disabled=true;b.textContent='Einen Moment …';
    try{await oeffnen(document.getElementById('pw').value);}
    catch(x){e.textContent='Der Code stimmt nicht.';b.disabled=false;b.textContent='Einladung öffnen';}
  });
  try{var g=sessionStorage.getItem('hz-code');
      if(g)oeffnen(g).catch(function(){
        sessionStorage.removeItem('hz-code');
        document.documentElement.className='';   // Eingabe doch zeigen
      });}catch(x){}
})();
