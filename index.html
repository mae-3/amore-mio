<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Anna &amp; Maik</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
        background: radial-gradient(ellipse at center, #3a322b 0%, #1c1815 100%);
        color: #f5efe6;
        font-family: Georgia, 'Times New Roman', serif;
        text-align: center;
    }
    .karte { max-width: 460px; }
    h1 {
        font-size: clamp(2.6rem, 11vw, 4rem);
        font-weight: 500;
        margin: 0;
        line-height: 1.1;
    }
    .linie {
        width: 54px;
        height: 1px;
        background: #c5a059;
        margin: 36px auto;
    }
    .tage {
        margin: 0;
        font-size: .72rem;
        letter-spacing: .24em;
        text-transform: uppercase;
        color: #a3937a;
        font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
    }
    .tage strong { color: #c5a059; font-size: 1.05rem; letter-spacing: .1em; }
</style>
</head>
<body>
    <div class="karte">
        <h1>Anna &amp; Maik</h1>

        <div class="linie"></div>

        <p class="tage" id="tage"></p>
    </div>

<script>
    var ziel = new Date(2026, 11, 19).getTime();
    var tage = Math.ceil((ziel - Date.now()) / 86400000);
    if (tage > 0) {
        document.getElementById('tage').innerHTML =
            'Noch <strong>' + tage + '</strong> ' + (tage === 1 ? 'Tag' : 'Tage');
    }
</script>
</body>
</html>
