            wechsel:'English'},
        en:{platz:'Access code',knopf:'Open invitation',warte:'One moment …',
            fehler:'That code is not correct.',hinweis:'You’ll find the code in our message.',
            wechsel:'Deutsch'}})[spr];
    document.documentElement.lang=spr;
    document.getElementById('pw').placeholder=T.platz;
    if(!b.disabled)b.textContent=T.knopf;
    document.getElementById('h').textContent=T.hinweis;
    document.getElementById('w').textContent=T.wechsel;
  }
  texteSetzen();
  /* Kleiner Sprachwechsel direkt auf der Sperrseite. Die Wahl gilt fuer die
     Sitzung und damit auch fuer die Seite dahinter. */
  document.getElementById('w').addEventListener('click',function(){
    spr = spr==='de' ? 'en' : 'de';
    try{sessionStorage.setItem('hz-sprache',spr);}catch(x){}
    texteSetzen();
  });

  f.addEventListener('submit',async function(ev){
    ev.preventDefault();e.textContent='';b.disabled=true;b.textContent=T.warte;
    try{await oeffnen(document.getElementById('pw').value);}
    catch(x){e.textContent=T.fehler;b.disabled=false;b.textContent=T.knopf;}
  });
  try{var g=sessionStorage.getItem('hz-code');
      if(g)oeffnen(g).catch(function(){
        sessionStorage.removeItem('hz-code');
        document.documentElement.className='';   // Eingabe doch zeigen
      });}catch(x){}
})();
</script>
</body>
</html>
